name: Main-Workflow

on:
  push:
    branches: [main]
  pull_request:

permissions: write-all

jobs:
  bump-dev-version: # only do that when actually merging in main/develop branch
    if: github.event_name != 'pull_request'
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/bump_dev_version_tag_branch.yaml@main
    with:
      app-id: ${{ vars.ACTIONS_MANAGER_APPID }}
    secrets:
      private-key: ${{ secrets.ACTIONS_MANAGER_TOKEN }}


  # ospsuite pulls in tlf, ospsuite.plots and rSharp, which are not on CRAN.
  # pak does not follow the Remotes: field of a dependency, so these have to be
  # resolvable from a repository: the OSP r-universe serves them as binaries.
  R-CMD-Check:
    if: ${{ !cancelled() }}
    needs: [bump-dev-version]
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/R-CMD-check-build.yaml@main
    with:
      extra-repositories: https://open-systems-pharmacology.r-universe.dev

  test-coverage:
    if: ${{ !cancelled() }}
    needs: [bump-dev-version]
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/test-coverage.yaml@main
    with:
      extra-repositories: https://open-systems-pharmacology.r-universe.dev
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  pkgdown:
    if: ${{ !cancelled() }}
    needs: [bump-dev-version]
    uses:  Open-Systems-Pharmacology/Workflows/.github/workflows/pkgdown.yaml@main
    with:
      extra-repositories: https://open-systems-pharmacology.r-universe.dev
